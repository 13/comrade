[package]
name = "comrade"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
directories = "6.0.0"
inotify = "0.11.5"
nix = { version = "0.31.3", features = ["poll", "event", "signal", "term", "fs", "ioctl", "user"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
udev = "0.9.3"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

# No `panic = "abort"`: worker-thread panics are caught and shown in the
# status line (app.rs), which needs unwinding.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
