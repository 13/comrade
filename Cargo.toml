[package]
name = "comrade"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
directories = "6.0.0"
inotify = "0.11.5"
nix = { version = "0.31.3", features = ["poll", "event", "signal", "term", "fs", "ioctl"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
toml = "1.2.1"
udev = "0.9.3"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
