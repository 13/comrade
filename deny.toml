# Defaults for [advisories]: vulnerabilities deny, unmaintained warn.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
# comrade itself has no license field yet (publish = false); only check deps.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
